<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | FlightDecide</title>
  <meta name="description" content="This page doesn't exist. Head back to FlightDecide." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F172A;
      --bg-card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent-green: #22C55E;
      --accent-blue: #3B82F6;
      --text: #F0F0F5;
      --text-muted: #94A3B8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 90% at 50% 0%, rgba(34,197,94,0.08) 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .code {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: rgba(34,197,94,0.4); }
    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      h1 { font-size: 24px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">
      <span class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2a1.5 1.5 0 0 0-1.5 1.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="white"/></svg>
      </span>
      FlightDecide
    </a>
    <span class="code">Error 404</span>
    <h1>Off course &mdash; this page doesn't exist.</h1>
    <p>The link may be mistyped or the page may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Home</a>
      <a href="/guide.html" class="btn btn-outline">Pilot Guide</a>
    </div>
  </div>
</body>
</html>
